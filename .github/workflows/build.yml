name: Build Android APK
on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configurazione Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configurazione Java (Necessario per Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurazione Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'

      - name: Installa e prepara dipendenze Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # FIX FONDAMENTALE: Copia il requirements dentro src così Flet lo vede durante la build dell'APK
          cp requirements.txt src/requirements.txt

      - name: Fabbrica il file config.py usando i Secrets
        run: |
          echo "SUPABASE_URL = '${{ secrets.SUPABASE_URL }}'" > src/config.py
          echo "SUPABASE_KEY = '${{ secrets.SUPABASE_KEY }}'" >> src/config.py

      - name: Compilazione APK con Flet (Nome e Icona Custom)
        run: |
          flet build apk src --product "Tokyo Wallet" --icon assets/icona.png

      - name: Carica l'APK pronto nei download di GitHub
        uses: actions/upload-artifact@v4
        with:
          name: tokyo-travel-wallet-apk
          path: "**/*.apk"
