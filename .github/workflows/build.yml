name: Build Android APK

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configurazione Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configurazione Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurazione Flutter SDK (con Cache)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          cache: true

      - name: Accetta licenze Android (Silenzioso)
        run: |
          yes | flutter doctor --android-licenses > /dev/null

      - name: Installa dipendenze e crea requirements.txt pulito
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.25.0 requests==2.31.0
          echo "flet==0.25.0" > src/requirements.txt
          echo "requests==2.31.0" >> src/requirements.txt

      - name: Genera config.py dai secrets
        run: |
          echo "SUPABASE_URL = '${{ secrets.SUPABASE_URL }}'" > src/config.py
          echo "SUPABASE_KEY = '${{ secrets.SUPABASE_KEY }}'" >> src/config.py

      - name: Compilazione APK (Con Output Forzato)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          # Creiamo una cartella dedicata per l'output sulla root
          mkdir -p output_apk
          # Forziamo flet a sputare l'APK dentro questa cartella specifica
          flet build apk src -o output_apk --verbose

      - name: Caccia al Tesoro APK (Debug Totale)
        if: always()
        run: |
          echo "=== RICERCA TOTALMENTE GLOBALE DI FILE APK ==="
          find . -type f -name "*.apk" || echo "Nessun file .apk trovato in tutto il workspace!"
          
          echo "=== CONTENUTO DELLA CARTELLA OUTPUT FORZATO ==="
          ls -la output_apk || echo "La cartella output_apk è vuota o non esiste"

      - name: Carica APK come artefatto
        uses: actions/upload-artifact@v4
        with:
          name: tokyo-travel-wallet-apk
          path: |
            output_apk/**/*.apk
            **/*.apk
          if-no-files-found: warn
          retention-days: 30
