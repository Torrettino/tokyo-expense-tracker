name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configurazione Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configurazione Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurazione Flutter SDK (con Cache)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          cache: true

      - name: Installa dipendenze
        run: |
          pip install flet supabase requests

      - name: Fabbrica config.py
        run: |
          echo "SUPABASE_URL = '${{ secrets.SUPABASE_URL }}'" > src/config.py
          echo "SUPABASE_KEY = '${{ secrets.SUPABASE_KEY }}'" >> src/config.py

      - name: Compilazione APK
        run: |
          flet build apk src --yes

      - name: Carica APK
        uses: actions/upload-artifact@v4
        with:
          name: tokyo-travel-wallet-apk
          path: build/app/outputs/flutter-apk/*.apk
