name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configurazione Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configurazione Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurazione Flutter SDK (con Cache)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          cache: true

      - name: Accetta licenze Android
        run: |
          yes | flutter doctor --android-licenses

      - name: Installa dipendenze e crea requirements.txt pulito
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.22.1 supabase==2.4.0 postgrest==0.16.2 requests==2.31.0
          echo "flet==0.22.1" > src/requirements.txt
          echo "supabase==2.4.0" >> src/requirements.txt
          echo "postgrest==0.16.2" >> src/requirements.txt
          echo "requests==2.31.0" >> src/requirements.txt

      - name: Genera config.py dai secrets
        run: |
          echo "SUPABASE_URL = '${{ secrets.SUPABASE_URL }}'" > src/config.py
          echo "SUPABASE_KEY = '${{ secrets.SUPABASE_KEY }}'" >> src/config.py

      - name: Compilazione APK
        run: |
          flet build apk src

      - name: Carica APK come artefatto
        uses: actions/upload-artifact@v4
        with:
          name: tokyo-travel-wallet-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
