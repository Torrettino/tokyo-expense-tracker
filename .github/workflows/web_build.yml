name: Build Web App
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install flet
          echo "flet" > src/requirements.txt
          # Genera il config.py come facevamo prima
          echo "SUPABASE_URL = '${{ secrets.SUPABASE_URL }}'" > src/config.py
          echo "SUPABASE_KEY = '${{ secrets.SUPABASE_KEY }}'" >> src/config.py
          # Build della Web App
          flet build web src --output build_web
      
      - uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: build_web
          
