name: Build Web App
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      # Installazione esplicita dell'ambiente Flutter compatibile
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          cache: true
      
      # Generazione controllata dell'ambiente e iniezione sicura del file config nascosto
      - name: Crea requirements e config
        run: |
          pip install flet==0.22.1
          echo "flet==0.22.1" > src/requirements.txt
          echo "requests==2.31.0" >> src/requirements.txt
          echo "SUPABASE_URL = '${{ secrets.SUPABASE_URL }}'" > src/config.py
          echo "SUPABASE_KEY = '${{ secrets.SUPABASE_KEY }}'" >> src/config.py
      
      # Esecuzione della build web senza richieste di conferma interattive
      - name: Build Web
        run: flet build web src --output build_web --yes
      
      # Caricamento del pacchetto statico compilato pronto per il deployment
      - uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: build_web
          
