name: Build Web App
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      # 1. Installiamo Flutter esplicitamente per evitare prompt interattivi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          cache: true
      
      - name: Crea requirements e config
        run: |
          pip install flet
          echo "flet" > src/requirements.txt
          echo "SUPABASE_URL = '${{ secrets.SUPABASE_URL }}'" > src/config.py
          echo "SUPABASE_KEY = '${{ secrets.SUPABASE_KEY }}'" >> src/config.py
      
      # 2. Aggiungi --yes per saltare qualsiasi altra conferma
      - name: Build Web
        run: flet build web src --output build_web --yes
      
      - uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: build_web
          
